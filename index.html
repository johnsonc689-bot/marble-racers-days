<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>Marble Racers Days</title>
		<style>
html, body, #canvas { margin: 0; padding: 0; border: 0; }
body { color: white; background-color: #0b1020; overflow: hidden; touch-action: none; font-family: 'Segoe UI', 'Noto Sans', Arial, sans-serif; }
#canvas { display: block; }
#canvas:focus { outline: none; }

/* The loading screen: shown the instant the page opens, while the game downloads. */
#loading {
	position: absolute; inset: 0; z-index: 2;
	display: flex; flex-direction: column; justify-content: center; align-items: center;
	background: radial-gradient(ellipse at 50% 30%, #24346b 0%, #101737 55%, #070a18 100%);
	transition: opacity 0.5s ease;
}
#loading.done { opacity: 0; pointer-events: none; }
#title { font-size: clamp(28px, 6vw, 76px); font-weight: 900; letter-spacing: 0.04em; color: #ffe04d;
	text-shadow: 0 4px 0 #b3541e, 0 8px 24px rgba(0,0,0,0.6); margin: 0 16px 6vh; text-align: center; }
#track { position: relative; width: min(70vw, 760px); height: 18px; border-radius: 9px;
	background: rgba(255,255,255,0.12); box-shadow: inset 0 2px 6px rgba(0,0,0,0.5); }
#fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0%; border-radius: 9px;
	background: linear-gradient(90deg, #35c8ff, #6dff8a); transition: width 0.25s ease; }
#marble { position: absolute; top: 50%; left: 0%; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%;
	background: radial-gradient(circle at 32% 28%, #ffffff 0%, #ffd34d 18%, #ff7a2f 55%, #a8320f 100%);
	box-shadow: 0 6px 14px rgba(0,0,0,0.55); transition: left 0.25s ease; animation: roll 0.9s linear infinite; }
#marble::after { content: ""; position: absolute; left: 50%; top: 8%; width: 8%; height: 84%; margin-left: -4%;
	background: rgba(255,255,255,0.75); border-radius: 4px; }
@keyframes roll { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
#pct { margin-top: 3.2vh; font-size: clamp(16px, 2.4vw, 26px); font-weight: 700; color: #dfe8ff; }
#tip { margin: 2.2vh 24px 0; font-size: clamp(13px, 1.7vw, 19px); color: #a9b6dd; text-align: center; min-height: 1.4em; }
#notice { display: none; margin: 3vh 2rem 0; padding: 1rem; border-radius: 0.5rem; background: #5b3943; border: 1px solid #9b3943;
	color: #f0e0e0; text-align: center; line-height: 1.35; max-width: 640px; }
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	</head>
	<body>
		<canvas id="canvas">Your browser does not support the canvas tag.</canvas>
		<noscript>Marble Racers Days needs JavaScript turned on in your browser.</noscript>

		<div id="loading">
			<h1 id="title">MARBLE RACERS DAYS</h1>
			<div id="track"><div id="fill"></div><div id="marble"></div></div>
			<div id="pct">Getting ready...</div>
			<div id="tip"></div>
			<div id="notice"></div>
		</div>

		<script>
// Runs straight away (before the game's own code arrives), so the screen is never blank.
(function () {
	var tips = [
		"Tip: brake before a tight corner, then roll through it.",
		"Tip: every marble is the best at one thing. Try them all.",
		"Tip: invite friends by name from the Friends screen.",
		"Tip: heavy marbles are hard to knock off the track.",
		"Tip: in Demolition Derby, faster hits do more damage.",
		"Tip: in Last Marble Standing, stay away from the edge!",
		"Tip: build your own track in Make My Track."
	];
	var el = document.getElementById('tip');
	var i = Math.floor(Math.random() * tips.length);
	el.textContent = tips[i];
	window.__tipTimer = setInterval(function () { i = (i + 1) % tips.length; el.textContent = tips[i]; }, 3500);
}());
		</script>
		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":1104944,"index.wasm":35020354},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const loading = document.getElementById('loading');
	const fill = document.getElementById('fill');
	const marble = document.getElementById('marble');
	const pct = document.getElementById('pct');
	const notice = document.getElementById('notice');

	function setProgress(f) {
		const p = Math.max(0, Math.min(1, f));
		fill.style.width = (p * 100) + '%';
		marble.style.left = (p * 100) + '%';
	}

	function fail(err) {
		console.error(err);
		const text = (err instanceof Error) ? err.message : (typeof err === 'string' ? err : 'Something went wrong while loading.');
		pct.textContent = "The game couldn't start.";
		notice.textContent = text + '  Try refreshing the page, or use a newer browser (Chrome, Edge, Firefox or Safari).';
		notice.style.display = 'block';
		marble.style.animation = 'none';
	}

	const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
	if (missing.length !== 0) {
		fail('Your browser is missing: ' + missing.join(', ') + '.');
		return;
	}
	// Downloading starts right now, the moment the page opens (no click needed).
	engine.startGame({
		'onProgress': function (current, total) {
			if (current > 0 && total > 0) {
				// The download is the first 90% of the bar; starting up is the rest.
				setProgress(current / total * 0.9);
				pct.textContent = 'Loading...  ' + Math.round(current / total * 100) + '%';
				if (current >= total) {
					pct.textContent = 'Starting the game...';
				}
			}
		},
	}).then(() => {
		setProgress(1);
		pct.textContent = 'Go!';
		clearInterval(window.__tipTimer);
		loading.classList.add('done');
		setTimeout(function () { loading.remove(); }, 600);
	}, fail);
}());
		</script>
	</body>
</html>
